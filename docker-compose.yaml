# ---------------------------------------------------------------------------
# GCF Q&A — production Compose stack (fp_gcf).
#
# Architecture (mirrors the pimento setup on the same host):
#   caddy-docker-proxy -> fp-gcf (chainlit :18100)
#
# No published host port: caddy discovers the service from its labels over
# the shared external `caddy` network.
#
# Before first start, /workspace/fp_gcf/.env must contain at least:
#   CHAINLIT_AUTH_SECRET=<openssl rand -hex 32>
#   OPENAI_API_KEY=<key>
#   APP_USERS=admin:<password>          (or rely on self-registration)
#   FP_GCF_DOMAIN=<the public hostname caddy should serve>
#
# And the data the app reads must be synced (make push handles this):
#   data/index/default/      the FAISS index
#   data/raw/pdfs/           needed to locate page caches (fingerprint)
#   data/cache/pages/        page JPEGs + geometry for evidence images
#
# --- Image tagging and rollback --------------------------------------------
# The image tag carries the deployed commit, so each deploy leaves its
# predecessor on disk instead of overwriting the one and only `:latest`.
# Export the sha once, before any compose command (this is the one line):
#
#   export GIT_SHA=$(git rev-parse --short=7 HEAD)
#
# Shell environment beats the .env file for compose interpolation, so that
# export wins even though .env is also loaded here. With GIT_SHA unset the
# tag falls back to `fp-gcf:latest` and the stack behaves exactly as it did
# before this change — `docker compose build && docker compose up -d` on a
# bare shell still works.
#
# Roll back (no rebuild — the older image is already on the host):
#   docker image ls fp-gcf                  # tags still on disk
#   GIT_SHA=<older-sha> docker compose up -d
#   docker compose ps                       # confirm fp-gcf came back healthy
#
# Which sha was live when, and with which PLANNER/VERIFY switches, is
# recorded in docs/DEPLOYED.md (deploy PRINTS the row; the operator pastes it —
# a self-editing target would trip the dirty-tree guard push just gained).
#
# Caveat: once a deploy has tagged an image by sha, a *bare* `docker compose
# up -d` with GIT_SHA unset resolves to `fp-gcf:latest`, which may be stale or
# missing. Always export GIT_SHA on the server, or read the last line of
# docs/DEPLOYED.md to find the sha you meant.
# ---------------------------------------------------------------------------

services:
  fp-gcf:
    container_name: fp-gcf
    build:
      context: .
      dockerfile: Dockerfile
    # Tagged by commit so previous releases stay on disk and are rollback-able.
    # Unset GIT_SHA => `fp-gcf:latest`, i.e. the old behaviour. See the header.
    image: fp-gcf:${GIT_SHA:-latest}
    restart: unless-stopped

    env_file:
      - .env

    environment:
      PORT: "18100"
      INDEX_NAME: ${INDEX_NAME:-default}
      ALLOW_SIGNUP: ${ALLOW_SIGNUP:-1}
      PRELOAD: "1"

    # Whole directories bind-mounted so SQLite (db + WAL + SHM), the page
    # caches, persisted evidence images, and the HF model cache all survive
    # image and container replacement.
    volumes:
      - type: bind
        source: ./data
        target: /app/data
      - type: bind
        source: ./public/app_files
        target: /app/public/app_files
      - type: bind
        source: ./hf_cache
        target: /app/hf_cache

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request,sys;
          sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:18100/auth/config', timeout=5).status == 200 else 1)
      interval: 30s
      timeout: 8s
      start_period: 90s
      retries: 3

    labels:
      caddy: fp-gcf.ssa.tg
      caddy.reverse_proxy: "{{upstreams 18100}}"

    networks:
      - caddy

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

networks:
  caddy:
    external: true

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gcf-qna"
version = "0.1.0"
description = "GCF funding-proposal extraction, indexing, and Q&A chat"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "faiss-cpu",
    "sentence-transformers",
]

[project.optional-dependencies]
extraction = ["aiohttp", "aiofiles", "pymupdf", "pillow", "pypdf"]
app = ["chainlit==2.11.1", "openai==3.1.0", "SQLAlchemy==2.0.52",
       "aiosqlite==0.22.1", "greenlet==3.5.5", "pillow==12.0.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gcf_qna = ["app/templates/*.html"]
